<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dthqsz-cpu.github.io</title>
<style>
  :root {
    --paper: #e7ebee;
    --ink: #141d26;
    --soft: #5b6874;
    --sign: #1c7a62;
    --rule: #c9d1d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: var(--paper);
    color: var(--ink);
    font: 400 17px/1.7 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(22px, 4.6vw, 32px);
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  p { margin: 0 0 8px; max-width: 34em; color: var(--soft); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 30px 0 22px; }
  a {
    color: var(--sign);
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>dthqsz-cpu.github.io</h1>
  <p>个人 GitHub Pages 的根目录，没有对外内容。</p>
  <p>这里只会出现两样东西：站点验证文件，以及自己看的那个页面。</p>
  <hr>
  <p><a href="/tg-checkin-dashboard/">签到台账</a></p>
</main>
</body>
</html>
